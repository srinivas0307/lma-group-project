# Same settings as configs/baseline2.yaml (pool v1); only the pool and output folder differ.
# Baseline 2: conventional data-quality checks (verifier slot = "conventional").
# Thresholds are tuned on the dev split only (README Phase 5), then frozen and applied to test.

pool: archive/pools/pool_v2/pool_v2.jsonl
out_dir: archive/results/baseline2_v2

tuning:
  split: dev
  # Pick thresholds that maximise dev recall on runnable wrong candidates, subject to this
  # cap on the dev false-rejection rate (correct candidates rejected / correct candidates).
  max_false_rejection_rate: 0.10
  max_passes: 10
  # Among equally good values: "strict" keeps a check on if it costs nothing on dev (strong baseline);
  # "lenient" switches it off. The other choice is always written too, as a sensitivity check.
  # Dev-only reason for "lenient": same dev recall (0.765) as "strict" at a lower dev FRR (0.000 vs 0.067).
  # Note: both variants' test results had already been printed when this was set; report both.
  tie_break: lenient

# Untuned, hand-set thresholds. Reported next to the tuned ones as a sensitivity check.
default_thresholds:
  max_dropped_columns: 0
  max_row_ratio: 1.0
  min_row_ratio: 0.5
  max_index_not_subset: 0
  max_null_increase: 0.0
  max_new_column_null_frac: 0.5
  dtype_mode: compatible        # strict | compatible | off
  max_lost_unique_columns: 0
  max_duplicate_rows_increase: 0
  max_out_of_range_frac: 0.0
  max_mean_shift_z: 0.5
  max_category_tvd: 0.1
  max_new_value_frac: 0.01

# Search grid. Values are listed from most lenient to strictest; ties go to the more lenient value.
grid:
  max_dropped_columns: [inf, 2, 1, 0]
  max_row_ratio: [inf, 1.2, 1.05, 1.0]
  min_row_ratio: [0, 0.5, 0.7, 0.8, 0.9, 0.95, 0.99]
  max_index_not_subset: [inf, 0]
  max_null_increase: [inf, 0.2, 0.05, 0.01, 0.0]
  max_new_column_null_frac: [inf, 0.5, 0.2, 0.05, 0.0]
  dtype_mode: ["off", compatible, strict]
  max_lost_unique_columns: [inf, 0]
  max_duplicate_rows_increase: [inf, 0]
  max_out_of_range_frac: [inf, 0.05, 0.01, 0.0]
  max_mean_shift_z: [inf, 1.0, 0.5, 0.25, 0.1]
  max_category_tvd: [inf, 0.3, 0.2, 0.1, 0.05, 0.02]
  max_new_value_frac: [inf, 0.05, 0.01, 0.0]
