[project]
name = "igt"
version = "0.1.0"
description = "Intent-gated verification of LLM-generated data transformations"
requires-python = ">=3.11"
dependencies = ["pandas==2.3.3", "numpy==2.1.3", "pyyaml==6.0.2", "pydantic==2.14.1"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["slow: runs many sandbox subprocesses"]

[tool.ruff]
line-length = 120
target-version = "py311"
