# ---------- identity ----------
id: airbnb_conv_006
version: 1
split: dev                         # test | dev
dataset: airbnb
data_file: data/airbnb_dev.csv
transformation_type: type_conversion
difficulty: easy                      # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Store the listing id as text rather than as a number.
assumptions:
  - "Only the listing id column changes; host_id stays numeric."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      out = df.copy()
      out["id"] = out["id"].astype(str)
      return out

gold_contract:
  contract_version: "1.0"
  must_change:
    - {id: c1, type: column_dtype, target: id, dtype: string}
  must_preserve:
    - id: p1
      type: column_value_relation
      target: id
      fn: cast
      args: [{col: id}, {lit: string}]
    - {id: p2, type: columns_unchanged, target: "*", except: [id]}
    - {id: p3, type: row_count, target: null, op: unchanged}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 1000
  columns_added: []
  columns_removed: []
  cells_changed: 1000

# ---------- notes ----------
notes: ""
