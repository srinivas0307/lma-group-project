system: agent_feedback
runner: eval/runner_agent.py
needs: gpu
args:
  system: agent_feedback
  mode: feedback
  backend: hf
  model: Qwen/Qwen2.5-7B-Instruct
  load-in-4bit: true
  verifier: oracle
  splits:
  - test
  categories:
  - R
  - C
  - T
  - E
  - S
  cache-dir: /kaggle/working/llm_cache
  out: /kaggle/working/results/stage2_agent
