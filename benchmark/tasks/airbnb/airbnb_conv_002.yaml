# ---------- identity ----------
id: airbnb_conv_002
version: 1
split: test                        # test | dev
dataset: airbnb
data_file: data/airbnb_dev.csv
transformation_type: type_conversion
difficulty: easy                      # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Store price as a decimal number (float) instead of an integer.
assumptions:
  - "Only the price column changes type; values stay the same."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      out = df.copy()
      out["price"] = out["price"].astype(float)
      return out

gold_contract:
  contract_version: "1.0"
  must_change:
    - {id: c1, type: column_dtype, target: price, dtype: float}
  must_preserve:
    - {id: p1, type: column_values_unchanged, target: price}
    - {id: p2, type: null_count, target: price, op: unchanged}
    - {id: p3, type: columns_unchanged, target: "*", except: [price]}
    - {id: p4, type: row_count, target: null, op: unchanged}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 1000
  columns_added: []
  columns_removed: []
  cells_changed: 0

# ---------- notes ----------
notes: ""
