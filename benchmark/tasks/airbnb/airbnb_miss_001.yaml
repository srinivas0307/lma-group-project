# ---------- identity ----------
id: airbnb_miss_001
version: 1
split: test                        # test | dev
dataset: airbnb
data_file: data/airbnb_dev.csv
transformation_type: missing_values
difficulty: easy                      # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Fill in the missing reviews_per_month values with 0.
assumptions:
  - "Only reviews_per_month is filled; existing values stay as they are."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      out = df.copy()
      out["reviews_per_month"] = out["reviews_per_month"].fillna(0)
      return out

gold_contract:
  contract_version: "1.0"
  must_change:
    - id: c1
      type: column_value_relation
      target: reviews_per_month
      where: {column: reviews_per_month, op: is_null}
      fn: const
      args: [{lit: 0}]
    - {id: c2, type: null_count, target: reviews_per_month, op: eq, value: 0}
  must_preserve:
    - id: p1
      type: column_values_unchanged
      target: reviews_per_month
      where: {column: reviews_per_month, op: not_null}
    - {id: p2, type: columns_unchanged, target: "*", except: [reviews_per_month]}
    - {id: p3, type: row_count, target: null, op: unchanged}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 1000
  columns_added: []
  columns_removed: []
  cells_changed: 41

# ---------- notes ----------
notes: ""
