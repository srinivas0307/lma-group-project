# ---------- identity ----------
id: airbnb_col_004
version: 1
split: test                        # test | dev
dataset: airbnb
data_file: data/airbnb_dev.csv
transformation_type: column_transformation
difficulty: easy                      # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Add availability_ratio: the number of available days divided by 365.
assumptions:
  - "Exact division, no rounding; new column name is availability_ratio."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      out = df.copy()
      out["availability_ratio"] = out["availability_365"] / 365
      return out

gold_contract:
  contract_version: "1.0"
  must_change:
    - {id: c1, type: columns_added, target: [availability_ratio]}
    - id: c2
      type: column_value_relation
      target: availability_ratio
      fn: div
      args: [{col: availability_365}, {lit: 365}]
      atol: 1.0e-9
  must_preserve:
    - {id: p1, type: columns_unchanged, target: "*", except: []}
    - {id: p2, type: row_count, target: null, op: unchanged}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 1000
  columns_added: [availability_ratio]
  columns_removed: []
  cells_changed: 0

# ---------- notes ----------
notes: ""
