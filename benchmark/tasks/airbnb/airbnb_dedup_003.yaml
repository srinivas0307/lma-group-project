# ---------- identity ----------
id: airbnb_dedup_003
version: 1
split: test                        # test | dev
dataset: airbnb
data_file: data/airbnb_dev.csv
transformation_type: deduplication
difficulty: hard                      # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Keep only one listing per host: the first one that appears in the data.
assumptions:
  - "'First' means earliest in the original row order."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      return df.drop_duplicates(subset=["host_id"], keep="first").copy()

gold_contract:
  contract_version: "1.0"
  must_change:
    - {id: c1, type: duplicate_count, target: [host_id], op: eq, value: 0, keep: first}
    - {id: c2, type: row_count, target: null, op: decreased}
  must_preserve:
    - {id: p1, type: columns_unchanged, target: "*", except: []}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 843
  columns_added: []
  columns_removed: []
  cells_changed: 0

# ---------- notes ----------
notes: ""
