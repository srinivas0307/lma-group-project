# ---------- identity ----------
id: airbnb_miss_005
version: 1
split: test                        # test | dev
dataset: airbnb
data_file: data/airbnb_dev.csv
transformation_type: missing_values
difficulty: hard                      # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  For listings that have no reviews, set reviews_per_month to 0.
assumptions:
  - "'No reviews' means number_of_reviews == 0; reviews_per_month is left as-is for all other listings."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      out = df.copy()
      out.loc[out["number_of_reviews"] == 0, "reviews_per_month"] = 0
      return out

gold_contract:
  contract_version: "1.0"
  must_change:
    - id: c1
      type: column_value_relation
      target: reviews_per_month
      where: {column: number_of_reviews, op: "==", value: 0}
      fn: const
      args: [{lit: 0}]
  must_preserve:
    - id: p1
      type: column_values_unchanged
      target: reviews_per_month
      where: {column: number_of_reviews, op: "!=", value: 0}
    - {id: p2, type: columns_unchanged, target: "*", except: [reviews_per_month]}
    - {id: p3, type: row_count, target: null, op: unchanged}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 1000
  columns_added: []
  columns_removed: []
  cells_changed: 41

# ---------- notes ----------
notes: ""
