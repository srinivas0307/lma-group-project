# ---------- identity ----------
id: airbnb_dedup_004
version: 1
split: test                        # test | dev
dataset: airbnb
data_file: data/airbnb_dev.csv
transformation_type: deduplication
difficulty: hard                      # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  For each host, keep just one listing per room type, using the last one that appears.
assumptions:
  - "Duplicate means same host_id and same room_type; 'last' means latest in the original row order."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      return df.drop_duplicates(subset=["host_id", "room_type"], keep="last").copy()

gold_contract:
  contract_version: "1.0"
  must_change:
    - {id: c1, type: duplicate_count, target: [host_id, room_type], op: eq, value: 0, keep: last}
    - {id: c2, type: row_count, target: null, op: decreased}
  must_preserve:
    - {id: p1, type: columns_unchanged, target: "*", except: []}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 868
  columns_added: []
  columns_removed: []
  cells_changed: 0

# ---------- notes ----------
notes: ""
