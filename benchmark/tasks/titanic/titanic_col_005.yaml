# ---------- identity ----------
id: titanic_col_005
version: 1
split: test                        # test | dev
dataset: titanic
data_file: data/Titanic-Dataset.csv
transformation_type: column_transformation
difficulty: hard                      # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Cap Fare at 200 (higher fares become 200) and raise every Age below 1 to 1. Missing ages stay missing.
assumptions:
  - "Fares of exactly 200 and ages of exactly 1 are unchanged."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      out = df.copy()
      out["Fare"] = out["Fare"].clip(upper=200)
      out["Age"] = out["Age"].clip(lower=1)
      return out

gold_contract:
  contract_version: "1.0"
  must_change:
    - id: c1
      type: column_value_relation
      target: Fare
      fn: clip
      args: [{col: Fare}, {lit: null}, {lit: 200}]
    - id: c2
      type: column_value_relation
      target: Age
      fn: clip
      args: [{col: Age}, {lit: 1}, {lit: null}]
  must_preserve:
    - {id: p1, type: null_count, target: Age, op: unchanged}
    - {id: p2, type: columns_unchanged, target: "*", except: [Fare, Age]}
    - {id: p3, type: row_count, target: null, op: unchanged}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 891
  rows_after: 891
  columns_added: []
  columns_removed: []
  cells_changed: 27

# ---------- notes ----------
notes: ""
