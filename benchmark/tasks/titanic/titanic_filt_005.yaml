# ---------- identity ----------
id: titanic_filt_005
version: 1
split: test                        # test | dev
dataset: titanic
data_file: data/Titanic-Dataset.csv
transformation_type: filtering
difficulty: medium                    # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Keep only the passengers who travelled alone, with no siblings, spouses, parents or children aboard.
assumptions:
  - "Travelling alone means SibSp == 0 and Parch == 0."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      return df[(df["SibSp"] == 0) & (df["Parch"] == 0)].copy()

gold_contract:
  contract_version: "1.0"
  must_change:
    - id: c1
      type: rows_removed_where
      target: null
      condition:
        any:
          - {column: SibSp, op: ">", value: 0}
          - {column: Parch, op: ">", value: 0}
    - {id: c2, type: row_count, target: null, op: decreased}
  must_preserve:
    - id: p1
      type: rows_retained_where
      target: null
      condition:
        all:
          - {column: SibSp, op: "==", value: 0}
          - {column: Parch, op: "==", value: 0}
    - {id: p2, type: columns_unchanged, target: "*", except: []}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 891
  rows_after: 537
  columns_added: []
  columns_removed: []
  cells_changed: 0

# ---------- notes ----------
notes: ""
