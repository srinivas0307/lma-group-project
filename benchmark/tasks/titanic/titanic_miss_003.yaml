# ---------- identity ----------
id: titanic_miss_003
version: 1
split: test                        # test | dev
dataset: titanic
data_file: data/Titanic-Dataset.csv
transformation_type: missing_values
difficulty: easy                      # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Drop the passengers whose port of embarkation is missing.
assumptions:
  - "Only Embarked is checked; rows missing Age or Cabin are kept."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      return df.dropna(subset=["Embarked"]).copy()

gold_contract:
  contract_version: "1.0"
  must_change:
    - id: c1
      type: rows_removed_where
      target: null
      condition: {column: Embarked, op: is_null}
    - {id: c2, type: row_count, target: null, op: decreased}
  must_preserve:
    - id: p1
      type: rows_retained_where
      target: null
      condition: {column: Embarked, op: not_null}
    - {id: p2, type: columns_unchanged, target: "*", except: []}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 891
  rows_after: 889
  columns_added: []
  columns_removed: []
  cells_changed: 0

# ---------- notes ----------
notes: ""
