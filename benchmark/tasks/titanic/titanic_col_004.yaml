# ---------- identity ----------
id: titanic_col_004
version: 1
split: test                        # test | dev
dataset: titanic
data_file: data/Titanic-Dataset.csv
transformation_type: column_transformation
difficulty: medium                    # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Recode Sex so that 'male' becomes 'M' and 'female' becomes 'F'.
assumptions:
  - "The Sex column is replaced in place."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      out = df.copy()
      out["Sex"] = out["Sex"].map({"male": "M", "female": "F"})
      return out

gold_contract:
  contract_version: "1.0"
  must_change:
    - id: c1
      type: column_value_relation
      target: Sex
      fn: map
      args: [{col: Sex}, {lit: {male: M, female: F}}]
  must_preserve:
    - {id: p1, type: columns_unchanged, target: "*", except: [Sex]}
    - {id: p2, type: row_count, target: null, op: unchanged}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 891
  rows_after: 891
  columns_added: []
  columns_removed: []
  cells_changed: 891

# ---------- notes ----------
notes: ""
