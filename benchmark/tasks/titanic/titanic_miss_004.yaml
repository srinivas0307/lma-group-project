# ---------- identity ----------
id: titanic_miss_004
version: 1
split: test                        # test | dev
dataset: titanic
data_file: data/Titanic-Dataset.csv
transformation_type: missing_values
difficulty: medium                    # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Fill the missing Age values with the median age.
assumptions:
  - "The median is computed over the known ages of all passengers (28.0 in this data)."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      out = df.copy()
      out["Age"] = out["Age"].fillna(out["Age"].median())
      return out

gold_contract:
  contract_version: "1.0"
  must_change:
    - id: c1
      type: column_value_relation
      target: Age
      where: {column: Age, op: is_null}
      fn: const
      args: [{lit: 28.0}]
    - {id: c2, type: null_count, target: Age, op: eq, value: 0}
  must_preserve:
    - id: p1
      type: column_values_unchanged
      target: Age
      where: {column: Age, op: not_null}
    - {id: p2, type: columns_unchanged, target: "*", except: [Age]}
    - {id: p3, type: row_count, target: null, op: unchanged}
    - {id: p4, type: column_dtype, target: Age, dtype: float}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 891
  rows_after: 891
  columns_added: []
  columns_removed: []
  cells_changed: 177

# ---------- notes ----------
notes: "The literal 28.0 is data-dependent: it is the median of this file."
