# ---------- identity ----------
id: titanic_dedup_005
version: 1
split: test                        # test | dev
dataset: titanic
data_file: data/Titanic-Dataset.csv
transformation_type: deduplication
difficulty: hard                      # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Passengers with the same ticket and the same cabin are duplicates. Keep the last one of each.
assumptions:
  - "Two missing cabins count as the same cabin, so passengers on one ticket with no cabin recorded are duplicates."
  - "'Last' means last in the original row order."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      return df.drop_duplicates(subset=["Ticket", "Cabin"], keep="last").copy()

gold_contract:
  contract_version: "1.0"
  must_change:
    - {id: c1, type: duplicate_count, target: ["Ticket", "Cabin"], op: eq, value: 0, keep: last}
    - {id: c2, type: row_count, target: null, op: decreased}
  must_preserve:
    - {id: p1, type: columns_unchanged, target: "*", except: []}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 891
  rows_after: 710
  columns_added: []
  columns_removed: []
  cells_changed: 0

# ---------- notes ----------
notes: ""
