# ---------- identity ----------
id: titanic_filt_001
version: 1
split: test                        # test | dev
dataset: titanic
data_file: data/Titanic-Dataset.csv
transformation_type: filtering
difficulty: easy                      # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Remove the passengers whose fare was 0.
assumptions:
  - "Only an exact fare of 0 counts; Fare has no negative values."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      return df[df["Fare"] != 0].copy()

gold_contract:
  contract_version: "1.0"
  must_change:
    - id: c1
      type: rows_removed_where
      target: null
      condition: {column: Fare, op: "==", value: 0}
    - {id: c2, type: row_count, target: null, op: decreased}
  must_preserve:
    - id: p1
      type: rows_retained_where
      target: null
      condition: {column: Fare, op: "!=", value: 0}
    - {id: p2, type: columns_unchanged, target: "*", except: []}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 891
  rows_after: 876
  columns_added: []
  columns_removed: []
  cells_changed: 0

# ---------- notes ----------
notes: ""
