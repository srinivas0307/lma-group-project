# ---------- identity ----------
id: taxi_filt_001
version: 1
split: test                        # test | dev
dataset: taxi
data_file: data/yellow_tripdata_2026-01.csv
transformation_type: filtering
difficulty: easy                      # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Remove the trips with a negative fare_amount.
assumptions:
  - "A fare of exactly 0 is kept."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      return df[df["fare_amount"] >= 0].copy()

gold_contract:
  contract_version: "1.0"
  must_change:
    - id: c1
      type: rows_removed_where
      target: null
      condition: {column: fare_amount, op: "<", value: 0}
    - {id: c2, type: row_count, target: null, op: decreased}
  must_preserve:
    - id: p1
      type: rows_retained_where
      target: null
      condition: {column: fare_amount, op: ">=", value: 0}
    - {id: p2, type: columns_unchanged, target: "*", except: []}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 993
  columns_added: []
  columns_removed: []
  cells_changed: 0

# ---------- notes ----------
notes: ""
