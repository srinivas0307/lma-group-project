# ---------- identity ----------
id: taxi_col_005
version: 1
split: test                        # test | dev
dataset: taxi
data_file: data/yellow_tripdata_2026-01.csv
transformation_type: column_transformation
difficulty: hard                      # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Add a column fare_per_mile equal to fare_amount divided by trip_distance. For trips with a distance of 0 the value should be missing.
assumptions:
  - "No rounding. Negative fares give negative values."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      out = df.copy()
      out["fare_per_mile"] = out["fare_amount"] / out["trip_distance"].replace(0, np.nan)
      return out

gold_contract:
  contract_version: "1.0"
  must_change:
    - {id: c1, type: columns_added, target: [fare_per_mile]}
    - id: c2
      type: column_value_relation
      target: fare_per_mile
      fn: div
      args: [{col: fare_amount}, {col: trip_distance}]
      atol: 1.0e-9
  must_preserve:
    - {id: p1, type: columns_unchanged, target: "*", except: []}
    - {id: p2, type: row_count, target: null, op: unchanged}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 1000
  columns_added: ["fare_per_mile"]
  columns_removed: []
  cells_changed: 0

# ---------- notes ----------
notes: ""
