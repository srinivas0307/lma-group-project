# ---------- identity ----------
id: taxi_col_001
version: 1
split: test                        # test | dev
dataset: taxi
data_file: data/yellow_tripdata_2026-01.csv
transformation_type: column_transformation
difficulty: easy                      # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Add a column fare_plus_tip equal to fare_amount plus tip_amount.
assumptions:
  - "No rounding."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      out = df.copy()
      out["fare_plus_tip"] = out["fare_amount"] + out["tip_amount"]
      return out

gold_contract:
  contract_version: "1.0"
  must_change:
    - {id: c1, type: columns_added, target: [fare_plus_tip]}
    - id: c2
      type: column_value_relation
      target: fare_plus_tip
      fn: add
      args: [{col: fare_amount}, {col: tip_amount}]
      atol: 1.0e-9
  must_preserve:
    - {id: p1, type: columns_unchanged, target: "*", except: []}
    - {id: p2, type: row_count, target: null, op: unchanged}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 1000
  columns_added: ["fare_plus_tip"]
  columns_removed: []
  cells_changed: 0

# ---------- notes ----------
notes: ""
