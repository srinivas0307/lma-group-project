# ---------- identity ----------
id: taxi_miss_004
version: 1
split: test                        # test | dev
dataset: taxi
data_file: data/yellow_tripdata_2026-01.csv
transformation_type: missing_values
difficulty: medium                    # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  RatecodeID 99 means the rate code is unknown. Assume the standard rate and replace those values with 1.
assumptions:
  - "Other rate codes are unchanged."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      out = df.copy()
      out["RatecodeID"] = out["RatecodeID"].replace(99, 1)
      return out

gold_contract:
  contract_version: "1.0"
  must_change:
    - id: c1
      type: column_value_relation
      target: RatecodeID
      where: {column: RatecodeID, op: "==", value: 99}
      fn: const
      args: [{lit: 1}]
  must_preserve:
    - id: p1
      type: column_values_unchanged
      target: RatecodeID
      where: {column: RatecodeID, op: "!=", value: 99}
    - {id: p2, type: columns_unchanged, target: "*", except: [RatecodeID]}
    - {id: p3, type: row_count, target: null, op: unchanged}
    - {id: p4, type: null_count, target: RatecodeID, op: unchanged}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 1000
  columns_added: []
  columns_removed: []
  cells_changed: 3

# ---------- notes ----------
notes: ""
