# ---------- identity ----------
id: taxi_miss_006
version: 1
split: dev                        # test | dev
dataset: taxi
data_file: data/yellow_tripdata_2026-01.csv
transformation_type: missing_values
difficulty: medium                    # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  A trip_distance of 0 means the distance was not recorded. Mark those values as missing.
assumptions:
  - "Rows are kept."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      out = df.copy()
      out["trip_distance"] = out["trip_distance"].replace(0, np.nan)
      return out

gold_contract:
  contract_version: "1.0"
  must_change:
    - id: c1
      type: column_value_relation
      target: trip_distance
      where: {column: trip_distance, op: "==", value: 0}
      fn: "null"
    - {id: c2, type: null_count, target: trip_distance, op: increased}
  must_preserve:
    - id: p1
      type: column_values_unchanged
      target: trip_distance
      where: {column: trip_distance, op: "!=", value: 0}
    - {id: p2, type: columns_unchanged, target: "*", except: [trip_distance]}
    - {id: p3, type: row_count, target: null, op: unchanged}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 1000
  columns_added: []
  columns_removed: []
  cells_changed: 7

# ---------- notes ----------
notes: ""
