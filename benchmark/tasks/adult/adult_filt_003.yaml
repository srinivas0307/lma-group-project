# ---------- identity ----------
id: adult_filt_003
version: 1
split: test                        # test | dev
dataset: adult
data_file: data/adult_dev.csv
transformation_type: filtering
difficulty: medium                    # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Keep only the people whose native country is United-States.
assumptions:
  - "Records with a missing native-country are removed (they are not known to be United-States)."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      return df[df["native-country"] == "United-States"].copy()

gold_contract:
  contract_version: "1.0"
  must_change:
    - id: c1
      type: rows_removed_where
      target: null
      condition: 
        not: {column: native-country, op: "==", value: United-States}
    - {id: c2, type: row_count, target: null, op: decreased}
  must_preserve:
    - id: p1
      type: rows_retained_where
      target: null
      condition: {column: native-country, op: "==", value: United-States}
    - {id: p2, type: columns_unchanged, target: "*", except: []}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 902
  columns_added: []
  columns_removed: []
  cells_changed: 0

# ---------- notes ----------
notes: ""
