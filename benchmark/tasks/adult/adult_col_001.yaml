# ---------- identity ----------
id: adult_col_001
version: 1
split: test                        # test | dev
dataset: adult
data_file: data/adult_dev.csv
transformation_type: column_transformation
difficulty: easy                      # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Add a column net_capital equal to capital-gain minus capital-loss.
assumptions:
  - "New column name is exactly net_capital."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      out = df.copy()
      out["net_capital"] = out["capital-gain"] - out["capital-loss"]
      return out

gold_contract:
  contract_version: "1.0"
  must_change:
    - {id: c1, type: columns_added, target: [net_capital]}
    - id: c2
      type: column_value_relation
      target: net_capital
      fn: sub
      args: [{col: capital-gain}, {col: capital-loss}]
  must_preserve:
    - {id: p1, type: columns_unchanged, target: "*", except: []}
    - {id: p2, type: row_count, target: null, op: unchanged}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 1000
  columns_added: [net_capital]
  columns_removed: []
  cells_changed: 0

# ---------- notes ----------
notes: ""
