# ---------- identity ----------
id: adult_conv_001
version: 1
split: test                        # test | dev
dataset: adult
data_file: data/adult_dev.csv
transformation_type: type_conversion
difficulty: easy                      # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Make income a categorical column.
assumptions:
  - "Categories are the existing two values, unchanged; no ordering."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      out = df.copy()
      out["income"] = out["income"].astype("category")
      return out

gold_contract:
  contract_version: "1.0"
  must_change:
    - {id: c1, type: column_dtype, target: income, dtype: category}
  must_preserve:
    - {id: p1, type: column_values_unchanged, target: income}
    - {id: p2, type: null_count, target: income, op: unchanged}
    - {id: p3, type: columns_unchanged, target: "*", except: [income]}
    - {id: p4, type: row_count, target: null, op: unchanged}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 1000
  columns_added: []
  columns_removed: []
  cells_changed: 0

# ---------- notes ----------
notes: ""
