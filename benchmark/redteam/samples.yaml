# Red-team set for the safety checker and sandbox (README Phase 3).
#
# expect:
#   blocked    the AST guard must reject it (static escape: files, OS, network, interpreter internals)
#   contained  can't be detected statically (resource abuse); the AST guard lets it through and the
#              executor must stop it. `contained_as` lists acceptable ExecResult statuses.
# Every sample is also run through the executor with the guard bypassed where `bypass_check` is set,
# to show the second layer holds on its own.

samples:
  - id: rt_file_read_open
    category: file_io
    expect: blocked
    code: |
      def transform(df):
          df["leak"] = open("/etc/passwd").read()[:20]
          return df

  - id: rt_file_write_open
    category: file_io
    expect: blocked
    code: |
      def transform(df):
          with open("pwned.txt", "w") as fh:
              fh.write("x")
          return df

