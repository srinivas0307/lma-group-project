  - id: rt_pickle_reduce
    category: interpreter
    expect: blocked
    bypass_check: true          # even unguarded, the parent's restricted unpickler refuses builtins.print
    contained_as: [error]
    code: |
      class Evil:
          def __reduce__(self):
              return (print, ("pwned",))
      def transform(df):
          df["x"] = [Evil()] * len(df)
          return df

  - id: rt_socket
