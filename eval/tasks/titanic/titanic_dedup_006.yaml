# ---------- identity ----------
id: titanic_dedup_006
version: 1
status: draft                      # draft | reviewed | frozen
split: dev                        # test | dev
dataset: titanic
data_file: data/Titanic-Dataset.csv
transformation_type: deduplication
difficulty: medium                    # suggested; easy | medium | hard
annotator: kiro-draft
reviewer: null

# ---------- the user request ----------
request: >
  Passengers with the same ticket and the same fare belong to one booking. Keep only the first passenger of each booking.
assumptions:
  - "'First' means first in the original row order; fares match exactly."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      return df.drop_duplicates(subset=["Ticket", "Fare"], keep="first").copy()

gold_contract:
  contract_version: "1.0"
  must_change:
    - {id: c1, type: duplicate_count, target: ["Ticket", "Fare"], op: eq, value: 0, keep: first}
    - {id: c2, type: row_count, target: null, op: decreased}
  must_preserve:
    - {id: p1, type: columns_unchanged, target: "*", except: []}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 891
  rows_after: 682
  columns_added: []
  columns_removed: []
  cells_changed: 0

# ---------- notes ----------
pitfalls:
  - "Deduplicates on Ticket only → c1 fails."
  - "keep='last' → c1 fails."
notes: ""
