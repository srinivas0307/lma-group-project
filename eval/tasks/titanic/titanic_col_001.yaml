# ---------- identity ----------
id: titanic_col_001
version: 1
split: test                        # test | dev
dataset: titanic
data_file: data/Titanic-Dataset.csv
transformation_type: column_transformation
difficulty: easy                      # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Add a column num_relatives with the number of relatives aboard: SibSp plus Parch.
assumptions:
  - "The passenger is not counted (no +1)."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      out = df.copy()
      out["num_relatives"] = out["SibSp"] + out["Parch"]
      return out

gold_contract:
  contract_version: "1.0"
  must_change:
    - {id: c1, type: columns_added, target: [num_relatives]}
    - id: c2
      type: column_value_relation
      target: num_relatives
      fn: add
      args: [{col: SibSp}, {col: Parch}]
  must_preserve:
    - {id: p1, type: columns_unchanged, target: "*", except: []}
    - {id: p2, type: row_count, target: null, op: unchanged}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 891
  rows_after: 891
  columns_added: ["num_relatives"]
  columns_removed: []
  cells_changed: 0

# ---------- notes ----------
notes: ""
