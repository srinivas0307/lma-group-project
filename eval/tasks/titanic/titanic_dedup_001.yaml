# ---------- the user request ----------
request: >
  Passengers who share the same ticket number are duplicates. Keep only the first passenger for each ticket.
assumptions:
  - "'First' means first in the original row order."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      return df.drop_duplicates(subset=["Ticket"], keep="first").copy()

gold_contract:
  contract_version: "1.0"
  must_change:
    - {id: c1, type: duplicate_count, target: ["Ticket"], op: eq, value: 0, keep: first}
    - {id: c2, type: row_count, target: null, op: decreased}
  must_preserve:
    - {id: p1, type: columns_unchanged, target: "*", except: []}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 891
  rows_after: 681
  columns_added: []
  columns_removed: []
  cells_changed: 0

# ---------- notes ----------
pitfalls:
  - "keep='last' → c1 fails."
  - "drop_duplicates() without subset (removes nothing) → c1, c2 fail."
  - "keep=False drops every shared ticket → c1 fails."
