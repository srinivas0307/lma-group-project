# ---------- identity ----------
id: titanic_col_003
version: 1
split: test                        # test | dev
dataset: titanic
data_file: data/Titanic-Dataset.csv
transformation_type: column_transformation
difficulty: medium                    # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Round Fare to 2 decimal places.
assumptions:
  - "Standard rounding as done by pandas/numpy round."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      out = df.copy()
      out["Fare"] = out["Fare"].round(2)
      return out

gold_contract:
  contract_version: "1.0"
  must_change:
    - id: c1
      type: column_value_relation
      target: Fare
      fn: round
      args: [{col: Fare}, {lit: 2}]
  must_preserve:
    - {id: p1, type: columns_unchanged, target: "*", except: [Fare]}
    - {id: p2, type: row_count, target: null, op: unchanged}
    - {id: p3, type: column_dtype, target: Fare, dtype: float}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 891
  rows_after: 891
  columns_added: []
  columns_removed: []
  cells_changed: 400

# ---------- notes ----------
notes: ""
