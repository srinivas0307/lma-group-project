# ---------- the user request ----------
request: >
  Keep only one passenger for each combination of class and sex: the first one listed.
assumptions:
  - "Class is Pclass; 'first' means first in the original row order."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      return df.drop_duplicates(subset=["Pclass", "Sex"], keep="first").copy()

gold_contract:
  contract_version: "1.0"
  must_change:
    - {id: c1, type: duplicate_count, target: ["Pclass", "Sex"], op: eq, value: 0, keep: first}
    - {id: c2, type: row_count, target: null, op: decreased}
  must_preserve:
    - {id: p1, type: columns_unchanged, target: "*", except: []}

