#
# Suggested idea : Remove passengers younger than 18; unknown ages stay.
# Snapshot facts : 113 rows have Age < 18 (139 with <= 18); 177 rows have no Age.   (profiled from data/Titanic-Dataset.csv; re-check when you write the task)
