# ---------- identity ----------
id: titanic_filt_003
version: 1
split: test                        # test | dev
dataset: titanic
data_file: data/Titanic-Dataset.csv
transformation_type: filtering
difficulty: medium                    # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Remove passengers younger than 18. Passengers whose age is unknown should stay.
assumptions:
  - "'Younger than 18' is strict: passengers aged exactly 18 are kept."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      return df[~(df["Age"] < 18)].copy()

gold_contract:
  contract_version: "1.0"
  must_change:
    - id: c1
      type: rows_removed_where
      target: null
      condition: {column: Age, op: "<", value: 18}
    - {id: c2, type: row_count, target: null, op: decreased}
  must_preserve:
    - id: p1
      type: rows_retained_where
      target: null
      condition:
        any:
          - {column: Age, op: ">=", value: 18}
          - {column: Age, op: is_null}
    - {id: p2, type: columns_unchanged, target: "*", except: []}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 891
  rows_after: 778
  columns_added: []
  columns_removed: []
  cells_changed: 0

# ---------- notes ----------
notes: ""
