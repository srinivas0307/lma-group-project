#
# Suggested idea : Remove first-class passengers who paid less than 30.
# Snapshot facts : 42 first-class passengers have Fare < 30 (including first-class zero fares).   (profiled from data/Titanic-Dataset.csv; re-check when you write the task)
# Watch out for  : Only first class is affected; '< 30' is strict.
#
