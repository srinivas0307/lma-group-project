# ---------- identity ----------
id: titanic_conv_004
version: 1
split: test                        # test | dev
dataset: titanic
data_file: data/Titanic-Dataset.csv
transformation_type: type_conversion
difficulty: easy                      # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Store PassengerId as text instead of a number.
assumptions:
  - "Text is the plain decimal form, e.g. 1 -> '1'."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      out = df.copy()
      out["PassengerId"] = out["PassengerId"].astype(str)
      return out

gold_contract:
  contract_version: "1.0"
  must_change:
    - {id: c1, type: column_dtype, target: PassengerId, dtype: string}
  must_preserve:
    - id: p1
      type: column_value_relation
      target: PassengerId
      fn: cast
      args: [{col: PassengerId}, {lit: string}]
    - {id: p2, type: columns_unchanged, target: "*", except: [PassengerId]}
    - {id: p3, type: row_count, target: null, op: unchanged}

