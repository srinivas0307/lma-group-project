# ---------- identity ----------
id: titanic_col_002
version: 1
split: test                        # test | dev
dataset: titanic
data_file: data/Titanic-Dataset.csv
transformation_type: column_transformation
difficulty: medium                    # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Remove leading and trailing whitespace from passenger names.
assumptions:
  - "Spaces and punctuation inside names are kept."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      out = df.copy()
      out["Name"] = out["Name"].str.strip()
      return out

gold_contract:
  contract_version: "1.0"
  must_change:
    - id: c1
      type: column_value_relation
      target: Name
      fn: strip
      args: [{col: Name}]
  must_preserve:
    - {id: p1, type: columns_unchanged, target: "*", except: [Name]}
    - {id: p2, type: row_count, target: null, op: unchanged}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 891
  rows_after: 891
  columns_added: []
  columns_removed: []
  cells_changed: 2

# ---------- notes ----------
notes: "Only 2 names change, so the task is mostly a no-op check on this file."
