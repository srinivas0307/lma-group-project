# ---------- the user request ----------
request: >
  Keep only the passengers who travelled alone, with no siblings, spouses, parents or children aboard.
assumptions:
  - "Travelling alone means SibSp == 0 and Parch == 0."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      return df[(df["SibSp"] == 0) & (df["Parch"] == 0)].copy()

