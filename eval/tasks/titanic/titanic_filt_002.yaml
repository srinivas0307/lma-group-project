# ---------- identity ----------
id: titanic_filt_002
version: 1
split: test                        # test | dev
dataset: titanic
data_file: data/Titanic-Dataset.csv
transformation_type: filtering
difficulty: medium                    # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Keep only the passengers who embarked at Southampton (S) or Cherbourg (C).
assumptions:
  - "Passengers with a missing Embarked value did not provably embark at S or C, so they are removed."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      return df[df["Embarked"].isin(["S", "C"])].copy()

gold_contract:
  contract_version: "1.0"
  must_change:
    - id: c1
      type: rows_removed_where
      target: null
      condition:
        any:
          - {column: Embarked, op: not_in, value: [S, C]}
          - {column: Embarked, op: is_null}
    - {id: c2, type: row_count, target: null, op: decreased}
  must_preserve:
    - id: p1
      type: rows_retained_where
      target: null
      condition: {column: Embarked, op: in, value: [S, C]}
    - {id: p2, type: columns_unchanged, target: "*", except: []}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 891
  rows_after: 812
  columns_added: []
  columns_removed: []
  cells_changed: 0

# ---------- notes ----------
notes: ""
