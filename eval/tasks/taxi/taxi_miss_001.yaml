#
# Suggested idea : passenger_count 0 means not recorded; set it to missing.
# Snapshot facts : No real nulls in the file; 12 rows have passenger_count 0.   (profiled from data/yellow_tripdata_2026-01.csv; re-check when you write the task)
# Watch out for  : Whole-frame replace(0, NaN) also wipes zero tips, tolls, etc.
#
# You may replace the idea entirely; keep the id, dataset and type.
# =====================================================================

# ---------- identity ----------
id: taxi_miss_001
version: 1
status: draft                      # draft | reviewed | frozen
split: test                        # test | dev
dataset: taxi
data_file: data/yellow_tripdata_2026-01.csv
transformation_type: missing_values
difficulty: medium                    # suggested; easy | medium | hard
annotator: kiro-draft
reviewer: null

# ---------- the user request ----------
request: >
  A passenger_count of 0 means the driver did not record it. Mark those values as missing.
assumptions:
  - "Only passenger_count is changed; zeros in other columns are real values."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      out = df.copy()
      out["passenger_count"] = out["passenger_count"].replace(0, np.nan)
      return out

gold_contract:
  contract_version: "1.0"
  must_change:
    - id: c1
      type: column_value_relation
      target: passenger_count
      where: {column: passenger_count, op: "==", value: 0}
      fn: "null"
    - {id: c2, type: null_count, target: passenger_count, op: increased}
  must_preserve:
    - id: p1
      type: column_values_unchanged
      target: passenger_count
      where: {column: passenger_count, op: "!=", value: 0}
    - {id: p2, type: columns_unchanged, target: "*", except: [passenger_count]}
    - {id: p3, type: row_count, target: null, op: unchanged}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 1000
  columns_added: []
  columns_removed: []
  cells_changed: 12

# ---------- notes ----------
pitfalls:
  - "df.replace(0, np.nan) on the whole frame → p2 fails."
  - "Drops the rows instead → c2, p3 fail."
  - "Replaces 0 with 1 → c1, c2 fail."
notes: ""
