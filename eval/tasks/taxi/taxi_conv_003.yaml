# ---------- identity ----------
id: taxi_conv_003
version: 1
split: test                        # test | dev
dataset: taxi
data_file: data/yellow_tripdata_2026-01.csv
transformation_type: type_conversion
difficulty: easy                      # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Store passenger_count as an integer instead of a float.
assumptions:
  - "All values are whole numbers; none are missing."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      out = df.copy()
      out["passenger_count"] = out["passenger_count"].astype("int64")
      return out

gold_contract:
  contract_version: "1.0"
  must_change:
    - {id: c1, type: column_dtype, target: passenger_count, dtype: int}
  must_preserve:
    - {id: p1, type: column_values_unchanged, target: passenger_count}
    - {id: p2, type: columns_unchanged, target: "*", except: [passenger_count]}
    - {id: p3, type: row_count, target: null, op: unchanged}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 1000
  columns_added: []
  columns_removed: []
  cells_changed: 0

# ---------- notes ----------
notes: ""
