# ---------- the user request ----------
request: >
  Remove the trips that were picked up before 1 January 2026. The pickup and dropoff times are text in the form YYYY-MM-DD HH:MM:SS (for example 2026-01-01 00:54:04).
assumptions:
  - "A pickup at exactly 2026-01-01 00:00:00 is kept."
  - "The pickup column itself is not changed."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      t = pd.to_datetime(df["tpep_pickup_datetime"], format="%Y-%m-%d %H:%M:%S")
      return df[t >= "2026-01-01"].copy()

gold_contract:
  contract_version: "1.0"
  must_change:
    - id: c1
      type: rows_removed_where
      target: null
      condition: {column: tpep_pickup_datetime, op: "<", value: "2026-01-01 00:00:00"}
    - {id: c2, type: row_count, target: null, op: decreased}
  must_preserve:
    - id: p1
      type: rows_retained_where
      target: null
      condition: {column: tpep_pickup_datetime, op: ">=", value: "2026-01-01 00:00:00"}
    - {id: p2, type: columns_unchanged, target: "*", except: []}

