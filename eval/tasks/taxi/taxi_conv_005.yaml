# ---------- identity ----------
id: taxi_conv_005
version: 1
split: test                        # test | dev
dataset: taxi
data_file: data/yellow_tripdata_2026-01.csv
transformation_type: type_conversion
difficulty: hard                      # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Convert store_and_fwd_flag to a boolean column: True for 'Y' and False for 'N'.
assumptions:
  - "The column has no missing values."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      out = df.copy()
      out["store_and_fwd_flag"] = out["store_and_fwd_flag"].map({"Y": True, "N": False}).astype(bool)
      return out

gold_contract:
  contract_version: "1.0"
  must_change:
    - {id: c1, type: column_dtype, target: store_and_fwd_flag, dtype: bool}
  must_preserve:
    - id: p1
      type: column_value_relation
      target: store_and_fwd_flag
      fn: map
      args: [{col: store_and_fwd_flag}, {lit: {"Y": true, "N": false}}]
    - {id: p2, type: columns_unchanged, target: "*", except: [store_and_fwd_flag]}
    - {id: p3, type: row_count, target: null, op: unchanged}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 1000
  columns_added: []
  columns_removed: []
  cells_changed: 1000

# ---------- notes ----------
notes: "Every value is 'N' in this file, so a mapping that sends everything to False also passes."
