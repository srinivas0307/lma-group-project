# ---------- identity ----------
id: taxi_filt_003
version: 1
split: test                        # test | dev
dataset: taxi
data_file: data/yellow_tripdata_2026-01.csv
transformation_type: filtering
difficulty: medium                    # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Remove the trips whose RatecodeID is 99 (unknown rate code).
assumptions:
  - "Other rate codes, including 5 and 6, are kept."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      return df[df["RatecodeID"] != 99].copy()

gold_contract:
  contract_version: "1.0"
  must_change:
    - id: c1
      type: rows_removed_where
      target: null
      condition: {column: RatecodeID, op: "==", value: 99}
    - {id: c2, type: row_count, target: null, op: decreased}
  must_preserve:
    - id: p1
      type: rows_retained_where
      target: null
      condition: {column: RatecodeID, op: "!=", value: 99}
    - {id: p2, type: columns_unchanged, target: "*", except: []}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 997
  columns_added: []
  columns_removed: []
  cells_changed: 0

# ---------- notes ----------
notes: ""
