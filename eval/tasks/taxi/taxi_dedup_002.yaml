# ---------- identity ----------
id: taxi_dedup_002
version: 1
status: draft                      # draft | reviewed | frozen
split: test                        # test | dev
dataset: taxi
data_file: data/yellow_tripdata_2026-01.csv
transformation_type: deduplication
difficulty: hard                      # suggested; easy | medium | hard
annotator: kiro-draft
reviewer: null

# ---------- the user request ----------
request: >
  Trips with the same VendorID, pickup time and dropoff time are duplicates. Keep only the last one of each.
assumptions:
  - "'Last' means last in the original row order."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      return df.drop_duplicates(subset=["VendorID", "tpep_pickup_datetime", "tpep_dropoff_datetime"], keep="last").copy()

gold_contract:
  contract_version: "1.0"
  must_change:
    - {id: c1, type: duplicate_count, target: ["VendorID", "tpep_pickup_datetime", "tpep_dropoff_datetime"], op: eq, value: 0, keep: last}
    - {id: c2, type: row_count, target: null, op: decreased}
  must_preserve:
    - {id: p1, type: columns_unchanged, target: "*", except: []}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 993
  columns_added: []
  columns_removed: []
  cells_changed: 0

# ---------- notes ----------
pitfalls:
  - "keep='first' (the default) → c1 fails."
  - "Removes the negative-fare rows instead (same rows here) (not distinguishable on this file; passes)."
notes: "On this file keep='last' removes exactly the 7 negative-fare rows, so 'remove refunds' code also passes."
