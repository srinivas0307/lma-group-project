      target: payment_type
      fn: map
      args: [{col: payment_type}, {lit: {1: Credit card, 2: Cash, 3: No charge, 4: Dispute}}]
    - {id: c2, type: column_dtype, target: payment_type, dtype: string}
  must_preserve:
