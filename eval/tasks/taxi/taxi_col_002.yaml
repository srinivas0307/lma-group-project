# ---------- identity ----------
id: taxi_col_002
version: 1
split: test                        # test | dev
dataset: taxi
data_file: data/yellow_tripdata_2026-01.csv
transformation_type: column_transformation
difficulty: medium                    # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Replace the payment_type codes with names: 1 -> 'Credit card', 2 -> 'Cash', 3 -> 'No charge', 4 -> 'Dispute'.
assumptions:
  - "The payment_type column is replaced in place; codes not in the list (none here) would stay as they are."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      out = df.copy()
      out["payment_type"] = out["payment_type"].map({1: "Credit card", 2: "Cash", 3: "No charge", 4: "Dispute"})
      return out

gold_contract:
  contract_version: "1.0"
  must_change:
    - id: c1
      type: column_value_relation
      target: payment_type
      fn: map
      args: [{col: payment_type}, {lit: {1: Credit card, 2: Cash, 3: No charge, 4: Dispute}}]
    - {id: c2, type: column_dtype, target: payment_type, dtype: string}
  must_preserve:
    - {id: p1, type: columns_unchanged, target: "*", except: [payment_type]}
    - {id: p2, type: row_count, target: null, op: unchanged}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 1000
  columns_added: []
  columns_removed: []
  cells_changed: 1000

# ---------- notes ----------
notes: ""
