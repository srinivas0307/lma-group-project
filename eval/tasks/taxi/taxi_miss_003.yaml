# ---------- identity ----------
id: taxi_miss_003
version: 1
status: draft                      # draft | reviewed | frozen
split: test                        # test | dev
dataset: taxi
data_file: data/yellow_tripdata_2026-01.csv
transformation_type: missing_values
difficulty: easy                      # suggested; easy | medium | hard
annotator: kiro-draft
reviewer: null

# ---------- the user request ----------
request: >
  A passenger_count of 0 means it was not recorded. Replace those values with 1.
assumptions:
  - "A taxi trip carries at least one passenger."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      out = df.copy()
      out.loc[out["passenger_count"] == 0, "passenger_count"] = 1
      return out

gold_contract:
  contract_version: "1.0"
  must_change:
    - id: c1
      type: column_value_relation
      target: passenger_count
      where: {column: passenger_count, op: "==", value: 0}
      fn: const
      args: [{lit: 1}]
  must_preserve:
    - id: p1
      type: column_values_unchanged
      target: passenger_count
      where: {column: passenger_count, op: "!=", value: 0}
    - {id: p2, type: columns_unchanged, target: "*", except: [passenger_count]}
    - {id: p3, type: row_count, target: null, op: unchanged}
    - {id: p4, type: null_count, target: passenger_count, op: unchanged}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 1000
  columns_added: []
  columns_removed: []
  cells_changed: 12

# ---------- notes ----------
pitfalls:
  - "df.replace(0, 1) on the whole frame → p2 fails."
  - "Replaces with the mean passenger count → c1 fails."
notes: ""
