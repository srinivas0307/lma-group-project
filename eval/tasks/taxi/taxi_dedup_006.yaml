# ---------- the user request ----------
request: >
  Trips from the same vendor (VendorID) with the same pickup time are duplicates. Keep the last one of each.
assumptions:
  - "'Last' means last in the original row order."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      return df.drop_duplicates(subset=["VendorID", "tpep_pickup_datetime"], keep="last").copy()

gold_contract:
  contract_version: "1.0"
  must_change:
    - {id: c1, type: duplicate_count, target: ["VendorID", "tpep_pickup_datetime"], op: eq, value: 0, keep: last}
    - {id: c2, type: row_count, target: null, op: decreased}
  must_preserve:
    - {id: p1, type: columns_unchanged, target: "*", except: []}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 908
  columns_added: []
  columns_removed: []
  cells_changed: 0

