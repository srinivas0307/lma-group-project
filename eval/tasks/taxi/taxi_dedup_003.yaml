# ---------- identity ----------
id: taxi_dedup_003
version: 1
status: draft                      # draft | reviewed | frozen
split: test                        # test | dev
dataset: taxi
data_file: data/yellow_tripdata_2026-01.csv
transformation_type: deduplication
difficulty: hard                      # suggested; easy | medium | hard
annotator: kiro-draft
reviewer: null

# ---------- the user request ----------
request: >
  Rows that match in every column except the money columns (fare_amount, extra, mta_tax, tip_amount, tolls_amount, improvement_surcharge, total_amount, congestion_surcharge, Airport_fee, cbd_congestion_fee) are duplicates. Keep only the first of each.
assumptions:
  - "'First' means first in the original row order."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      money = ["fare_amount", "extra", "mta_tax", "tip_amount", "tolls_amount", "improvement_surcharge",
               "total_amount", "congestion_surcharge", "Airport_fee", "cbd_congestion_fee"]
      keys = [c for c in df.columns if c not in money]
      return df.drop_duplicates(subset=keys, keep="first").copy()

gold_contract:
  contract_version: "1.0"
  must_change:
    - {id: c1, type: duplicate_count, target: "*", except: ["fare_amount", "extra", "mta_tax", "tip_amount", "tolls_amount", "improvement_surcharge", "total_amount", "congestion_surcharge", "Airport_fee", "cbd_congestion_fee"], op: eq, value: 0, keep: first}
    - {id: c2, type: row_count, target: null, op: decreased}
  must_preserve:
    - {id: p1, type: columns_unchanged, target: "*", except: []}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 993
  columns_added: []
  columns_removed: []
  cells_changed: 0

# ---------- notes ----------
pitfalls:
  - "drop_duplicates() on all columns (removes nothing) → c1, c2 fail."
  - "Takes abs() of money columns then deduplicates on all columns → p1 fails."
notes: ""
