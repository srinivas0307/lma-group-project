# ---------- identity ----------
id: adult_filt_001
version: 1
status: draft                      # draft | reviewed | frozen
split: test                        # test | dev
dataset: adult
data_file: data/adult_dev.csv
transformation_type: filtering
difficulty: easy                      # suggested; easy | medium | hard
annotator: kiro-draft
reviewer: null

# ---------- the user request ----------
request: >
  Remove everyone younger than 18 from the dataset.
assumptions:
  - "'Younger than 18' is strict: people aged exactly 18 are kept."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      return df[df["age"] >= 18].copy()

gold_contract:
  contract_version: "1.0"
  must_change:
    - id: c1
      type: rows_removed_where
      target: null
      condition: {column: age, op: "<", value: 18}
    - {id: c2, type: row_count, target: null, op: decreased}
  must_preserve:
    - id: p1
      type: rows_retained_where
      target: null
      condition: {column: age, op: ">=", value: 18}
    - {id: p2, type: columns_unchanged, target: "*", except: []}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 980
  columns_added: []
  columns_removed: []
  cells_changed: 0

# ---------- notes ----------
pitfalls:
  - "Uses age <= 18 → p1 fails (drops 18-year-olds)."
  - "Filters on education-num or another numeric column → c1, p1 fail."
  - "Adds dropna() → p1 fails (drops rows with missing workclass/occupation/native-country)."
notes: ""
