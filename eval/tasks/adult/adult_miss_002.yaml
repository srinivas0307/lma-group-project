# ---------- identity ----------
id: adult_miss_002
version: 1
status: draft                      # draft | reviewed | frozen
split: test                        # test | dev
dataset: adult
data_file: data/adult_dev.csv
transformation_type: missing_values
difficulty: easy                      # suggested; easy | medium | hard
annotator: kiro-draft
reviewer: null

# ---------- the user request ----------
request: >
  Where occupation is missing, write 'Unknown'.
assumptions:
  - "Only occupation is filled; workclass and native-country keep their missing values."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      out = df.copy()
      out["occupation"] = out["occupation"].fillna("Unknown")
      return out

gold_contract:
  contract_version: "1.0"
  must_change:
    - id: c1
      type: column_value_relation
      target: occupation
      where: {column: occupation, op: is_null}
      fn: const
      args: [{lit: Unknown}]
    - {id: c2, type: null_count, target: occupation, op: eq, value: 0}
  must_preserve:
    - id: p1
      type: column_values_unchanged
      target: occupation
      where: {column: occupation, op: not_null}
    - {id: p2, type: columns_unchanged, target: "*", except: [occupation]}
    - {id: p3, type: row_count, target: null, op: unchanged}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 1000
  columns_added: []
  columns_removed: []
  cells_changed: 62

# ---------- notes ----------
pitfalls:
  - "Fills workclass as well (same rows) → p2 fails."
  - "Fills with the most common occupation → c1 fails."
  - "Uses 'unknown' (lower case) → c1 fails."
notes: ""
