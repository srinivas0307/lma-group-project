# ---------- identity ----------
id: adult_conv_003
version: 1
split: test                        # test | dev
dataset: adult
data_file: data/adult_dev.csv
transformation_type: type_conversion
difficulty: hard                      # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Make education an ordered category that follows the education-num order, from Preschool (lowest) to Doctorate (highest).
assumptions:
  - "The order is the order of education-num (1 = Preschool … 16 = Doctorate)."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      order = ["Preschool", "1st-4th", "5th-6th", "7th-8th", "9th", "10th", "11th", "12th", "HS-grad", "Some-college", "Assoc-voc", "Assoc-acdm", "Bachelors", "Masters", "Prof-school", "Doctorate"]
      out = df.copy()
      out["education"] = pd.Categorical(out["education"], categories=order, ordered=True)
      return out

gold_contract:
  contract_version: "1.0"
  must_change:
    - {id: c1, type: column_dtype, target: education, dtype: category, ordered: true, categories: [Preschool, 1st-4th, 5th-6th, 7th-8th, 9th, 10th, 11th, 12th, HS-grad, Some-college, Assoc-voc, Assoc-acdm, Bachelors, Masters, Prof-school, Doctorate]}
  must_preserve:
    - {id: p1, type: column_values_unchanged, target: education}
    - {id: p2, type: null_count, target: education, op: unchanged}
    - {id: p3, type: columns_unchanged, target: "*", except: [education]}
    - {id: p4, type: row_count, target: null, op: unchanged}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 1000
  columns_added: []
  columns_removed: []
  cells_changed: 0

# ---------- notes ----------
notes: ""
