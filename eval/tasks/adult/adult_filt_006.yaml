# ---------- identity ----------
id: adult_filt_006
version: 1
status: draft                      # draft | reviewed | frozen
split: dev                         # test | dev
dataset: adult
data_file: data/adult_dev.csv
transformation_type: filtering
difficulty: hard                      # suggested; easy | medium | hard
annotator: kiro-draft
reviewer: null

# ---------- the user request ----------
request: >
  Remove private-sector workers who work fewer than 20 hours a week.
assumptions:
  - "Private sector means workclass == 'Private'; 'fewer than 20' is strict. Missing workclass is kept."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      return df[~((df["workclass"] == "Private") & (df["hours-per-week"] < 20))].copy()

gold_contract:
  contract_version: "1.0"
  must_change:
    - id: c1
      type: rows_removed_where
      target: null
      condition: 
        all:
          - {column: hours-per-week, op: "<", value: 20}
          - {column: workclass, op: "==", value: Private}
    - {id: c2, type: row_count, target: null, op: decreased}
  must_preserve:
    - id: p1
      type: rows_retained_where
      target: null
      condition: 
        not:
          all:
            - {column: hours-per-week, op: "<", value: 20}
            - {column: workclass, op: "==", value: Private}
    - {id: p2, type: columns_unchanged, target: "*", except: []}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 969
  columns_added: []
  columns_removed: []
  cells_changed: 0

# ---------- notes ----------
pitfalls:
  - "Removes everyone under 20 hours regardless of workclass → p1 fails."
  - "Uses <= 20 → p1 fails."
  - "Drops rows with missing workclass as a side effect → p1 fails."
notes: ""
