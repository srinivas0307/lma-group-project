# Suggested idea : Treat records with the same age, workclass, education, occupation and hours-per-week as duplicates; keep the first.
# Snapshot facts : 54 duplicates on that key (workclass/occupation nulls count as equal).   (profiled from data/adult_dev.csv; re-check when you write the task)
