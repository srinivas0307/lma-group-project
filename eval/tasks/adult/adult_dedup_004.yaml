# ---------- identity ----------
id: adult_dedup_004
version: 1
status: draft                      # draft | reviewed | frozen
split: test                        # test | dev
dataset: adult
data_file: data/adult_dev.csv
transformation_type: deduplication
difficulty: hard                      # suggested; easy | medium | hard
annotator: kiro-draft
reviewer: null

# ---------- the user request ----------
request: >
  Treat records with the same age, workclass, education, occupation and hours-per-week as duplicates, and keep the first one.
assumptions:
  - "Missing workclass/occupation values count as equal to each other when comparing."
  - "'First' means earliest in the original row order."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      keys = ["age", "workclass", "education", "occupation", "hours-per-week"]
      return df.drop_duplicates(subset=keys, keep="first").copy()

gold_contract:
  contract_version: "1.0"
  must_change:
    - {id: c1, type: duplicate_count, target: [age, education, hours-per-week, occupation, workclass], op: eq, value: 0, keep: first}
    - {id: c2, type: row_count, target: null, op: decreased}
  must_preserve:
    - {id: p1, type: columns_unchanged, target: "*", except: []}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 946
  columns_added: []
  columns_removed: []
  cells_changed: 0

# ---------- notes ----------
pitfalls:
  - "Drops rows with missing workclass/occupation before deduplicating → c1 fails."
  - "Leaves out hours-per-week from the key → c1 fails."
  - "keep='last' → c1 fails."
notes: ""
