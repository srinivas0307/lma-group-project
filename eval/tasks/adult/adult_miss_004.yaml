# ---------- identity ----------
id: adult_miss_004
version: 1
split: test                        # test | dev
dataset: adult
data_file: data/adult_dev.csv
transformation_type: missing_values
difficulty: medium                    # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Fill missing native-country values with the most common country, which is United-States.
assumptions:
  - "The fill value is the literal 'United-States'."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      out = df.copy()
      out["native-country"] = out["native-country"].fillna("United-States")
      return out

gold_contract:
  contract_version: "1.0"
  must_change:
    - id: c1
      type: column_value_relation
      target: native-country
      where: {column: native-country, op: is_null}
      fn: const
      args: [{lit: United-States}]
    - {id: c2, type: null_count, target: native-country, op: eq, value: 0}
  must_preserve:
    - id: p1
      type: column_values_unchanged
      target: native-country
      where: {column: native-country, op: not_null}
    - {id: p2, type: columns_unchanged, target: "*", except: [native-country]}
    - {id: p3, type: row_count, target: null, op: unchanged}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 1000
  columns_added: []
  columns_removed: []
  cells_changed: 18

# ---------- notes ----------
notes: ""
