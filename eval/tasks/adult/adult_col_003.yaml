# ---------- identity ----------
id: adult_col_003
version: 1
split: test                        # test | dev
dataset: adult
data_file: data/adult_dev.csv
transformation_type: column_transformation
difficulty: medium                    # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Cap hours-per-week at 60, so any value above 60 becomes 60.
assumptions:
  - "Values of 60 or less are unchanged; no rows are removed."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      out = df.copy()
      out["hours-per-week"] = out["hours-per-week"].clip(upper=60)
      return out

gold_contract:
  contract_version: "1.0"
  must_change:
    - id: c1
      type: column_value_relation
      target: hours-per-week
      fn: clip
      args: [{col: hours-per-week}, {lit: null}, {lit: 60}]
  must_preserve:
    - {id: p1, type: columns_unchanged, target: "*", except: [hours-per-week]}
    - {id: p2, type: row_count, target: null, op: unchanged}
    - {id: p3, type: column_dtype, target: hours-per-week, dtype: int}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 1000
  columns_added: []
  columns_removed: []
  cells_changed: 26

# ---------- notes ----------
notes: ""
