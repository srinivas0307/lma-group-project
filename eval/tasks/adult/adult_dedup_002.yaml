# ---------- identity ----------
id: adult_dedup_002
version: 1
status: draft                      # draft | reviewed | frozen
split: test                        # test | dev
dataset: adult
data_file: data/adult_dev.csv
transformation_type: deduplication
difficulty: hard                      # suggested; easy | medium | hard
annotator: kiro-draft
reviewer: null

# ---------- the user request ----------
request: >
  Records that match in every column except fnlwgt are duplicates. Keep only the last occurrence of each.
assumptions:
  - "'Last' means latest in the original row order; missing values in the same column count as equal."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      keys = [c for c in df.columns if c not in ("__rid__", "fnlwgt")]
      return df.drop_duplicates(subset=keys, keep="last").copy()

gold_contract:
  contract_version: "1.0"
  must_change:
    - {id: c1, type: duplicate_count, target: "*", except: [fnlwgt], op: eq, value: 0, keep: last}
    - {id: c2, type: row_count, target: null, op: decreased}
  must_preserve:
    - {id: p1, type: columns_unchanged, target: "*", except: []}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 993
  columns_added: []
  columns_removed: []
  cells_changed: 0

# ---------- notes ----------
pitfalls:
  - "keep='first' (the default) → c1 fails."
  - "drop_duplicates() without subset → c1, c2 fail."
