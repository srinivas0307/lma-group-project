# ---------- identity ----------
id: adult_col_004
version: 1
split: test                        # test | dev
dataset: adult
data_file: data/adult_dev.csv
transformation_type: column_transformation
difficulty: medium                    # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Convert all occupation values to lower case.
assumptions:
  - "Missing occupation values stay missing."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      out = df.copy()
      out["occupation"] = out["occupation"].str.lower()
      return out

gold_contract:
  contract_version: "1.0"
  must_change:
    - id: c1
      type: column_value_relation
      target: occupation
      fn: lower
      args: [{col: occupation}]
  must_preserve:
    - {id: p1, type: columns_unchanged, target: "*", except: [occupation]}
    - {id: p2, type: row_count, target: null, op: unchanged}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 1000
  columns_added: []
  columns_removed: []
  cells_changed: 938

# ---------- notes ----------
notes: ""
