# ---------- the user request ----------
request: >
  Convert all occupation values to lower case.
assumptions:
  - "Missing occupation values stay missing."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      out = df.copy()
      out["occupation"] = out["occupation"].str.lower()
      return out

gold_contract:
  contract_version: "1.0"
  must_change:
    - id: c1
      type: column_value_relation
      target: occupation
      fn: lower
      args: [{col: occupation}]
  must_preserve:
    - {id: p1, type: columns_unchanged, target: "*", except: [occupation]}
    - {id: p2, type: row_count, target: null, op: unchanged}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 1000
  columns_added: []
  columns_removed: []
  cells_changed: 938

# ---------- notes ----------
pitfalls:
  - "astype(str).str.lower(): with pandas 3.x missing values stay missing (accepted); with older pandas they become the text 'nan' → c1 fails."
  - "Lower-cases every text column → p1 fails."
  - "Upper-cases instead → c1 fails."
