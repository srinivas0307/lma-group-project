  - "New column name is exactly net_capital."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      out = df.copy()
      out["net_capital"] = out["capital-gain"] - out["capital-loss"]
      return out

gold_contract:
  contract_version: "1.0"
  must_change:
    - {id: c1, type: columns_added, target: [net_capital]}
    - id: c2
      type: column_value_relation
      target: net_capital
      fn: sub
      args: [{col: capital-gain}, {col: capital-loss}]
  must_preserve:
    - {id: p1, type: columns_unchanged, target: "*", except: []}
    - {id: p2, type: row_count, target: null, op: unchanged}

