# ---------- identity ----------
id: adult_dedup_005
version: 1
split: test                        # test | dev
dataset: adult
data_file: data/adult_dev.csv
transformation_type: deduplication
difficulty: hard                      # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Remove duplicates based on age, education, marital-status, occupation, relationship, race and sex. Keep the first record of each group.
assumptions:
  - "Missing occupation values count as equal to each other."
  - "'First' means earliest in the original row order."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      keys = ["age", "education", "marital-status", "occupation", "relationship", "race", "sex"]
      return df.drop_duplicates(subset=keys, keep="first").copy()

gold_contract:
  contract_version: "1.0"
  must_change:
    - {id: c1, type: duplicate_count, target: [age, education, marital-status, occupation, race, relationship, sex], op: eq, value: 0, keep: first}
    - {id: c2, type: row_count, target: null, op: decreased}
  must_preserve:
    - {id: p1, type: columns_unchanged, target: "*", except: []}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 929
  columns_added: []
  columns_removed: []
  cells_changed: 0

# ---------- notes ----------
notes: ""
