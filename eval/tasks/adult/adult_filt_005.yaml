# ---------- identity ----------
id: adult_filt_005
version: 1
status: draft                      # draft | reviewed | frozen
split: test                        # test | dev
dataset: adult
data_file: data/adult_dev.csv
transformation_type: filtering
difficulty: hard                      # suggested; easy | medium | hard
annotator: kiro-draft
reviewer: null

# ---------- the user request ----------
request: >
  Remove self-employed people (incorporated or not) who are older than 60.
assumptions:
  - "Self-employed means workclass is Self-emp-inc or Self-emp-not-inc; 'older than 60' is strict (age > 60)."
  - "People with missing workclass are not self-employed and are kept."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      mask = df["workclass"].isin(["Self-emp-inc", "Self-emp-not-inc"]) & (df["age"] > 60)
      return df[~mask].copy()

gold_contract:
  contract_version: "1.0"
  must_change:
    - id: c1
      type: rows_removed_where
      target: null
      condition: 
        all:
          - {column: age, op: ">", value: 60}
          - {column: workclass, op: in, value: [Self-emp-inc, Self-emp-not-inc]}
    - {id: c2, type: row_count, target: null, op: decreased}
  must_preserve:
    - id: p1
      type: rows_retained_where
      target: null
      condition: 
        not:
          all:
            - {column: age, op: ">", value: 60}
            - {column: workclass, op: in, value: [Self-emp-inc, Self-emp-not-inc]}
    - {id: p2, type: columns_unchanged, target: "*", except: []}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 986
  columns_added: []
  columns_removed: []
  cells_changed: 0

# ---------- notes ----------
pitfalls:
  - "Includes only Self-emp-not-inc → c1 fails."
  - "Uses OR instead of AND → p1 fails (removes all over-60s or all self-employed)."
  - "Uses age >= 60 → p1 fails."
notes: ""
