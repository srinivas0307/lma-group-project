# ---------- the user request ----------
request: >
  Drop the records of people who work more than 60 hours a week.
assumptions:
  - "'More than 60' is strict: exactly 60 hours is kept."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      return df[df["hours-per-week"] <= 60].copy()

