# ---------- identity ----------
id: adult_filt_002
version: 1
split: test                        # test | dev
dataset: adult
data_file: data/adult_dev.csv
transformation_type: filtering
difficulty: medium                    # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Drop the records of people who work more than 60 hours a week.
assumptions:
  - "'More than 60' is strict: exactly 60 hours is kept."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      return df[df["hours-per-week"] <= 60].copy()

gold_contract:
  contract_version: "1.0"
  must_change:
    - id: c1
      type: rows_removed_where
      target: null
      condition: {column: hours-per-week, op: ">", value: 60}
    - {id: c2, type: row_count, target: null, op: decreased}
  must_preserve:
    - id: p1
      type: rows_retained_where
      target: null
      condition: {column: hours-per-week, op: "<=", value: 60}
    - {id: p2, type: columns_unchanged, target: "*", except: []}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 974
  columns_added: []
  columns_removed: []
  cells_changed: 0

# ---------- notes ----------
notes: ""
