# ---------- identity ----------
id: adult_col_002
version: 1
split: test                        # test | dev
dataset: adult
data_file: data/adult_dev.csv
transformation_type: column_transformation
difficulty: easy                      # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Add hours_per_day: hours-per-week divided by 5.
assumptions:
  - "Exact division, no rounding."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      out = df.copy()
      out["hours_per_day"] = out["hours-per-week"] / 5
      return out

gold_contract:
  contract_version: "1.0"
  must_change:
    - {id: c1, type: columns_added, target: [hours_per_day]}
    - id: c2
      type: column_value_relation
      target: hours_per_day
      fn: div
      args: [{col: hours-per-week}, {lit: 5}]
      atol: 1.0e-9
  must_preserve:
    - {id: p1, type: columns_unchanged, target: "*", except: []}
    - {id: p2, type: row_count, target: null, op: unchanged}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 1000
  columns_added: [hours_per_day]
  columns_removed: []
  cells_changed: 0

# ---------- notes ----------
notes: ""
