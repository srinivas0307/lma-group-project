# ---------- identity ----------
id: airbnb_miss_006
version: 1
status: draft                      # draft | reviewed | frozen
split: dev                         # test | dev
dataset: airbnb
data_file: data/airbnb_dev.csv
transformation_type: missing_values
difficulty: medium                    # suggested; easy | medium | hard
annotator: kiro-draft
reviewer: null

# ---------- the user request ----------
request: >
  Where the host name is missing, use the listing's name instead.
assumptions:
  - "Only missing host_name values are replaced, with the value of the name column from the same row."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      out = df.copy()
      out["host_name"] = out["host_name"].fillna(out["name"])
      return out

gold_contract:
  contract_version: "1.0"
  must_change:
    - id: c1
      type: column_value_relation
      target: host_name
      where: {column: host_name, op: is_null}
      fn: identity
      args: [{col: name}]
    - {id: c2, type: null_count, target: host_name, op: eq, value: 0}
  must_preserve:
    - id: p1
      type: column_values_unchanged
      target: host_name
      where: {column: host_name, op: not_null}
    - {id: p2, type: columns_unchanged, target: "*", except: [host_name]}
    - {id: p3, type: row_count, target: null, op: unchanged}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 1000
  columns_added: []
  columns_removed: []
  cells_changed: 1

# ---------- notes ----------
pitfalls:
  - "Overwrites name with host_name (direction swapped) → c1, p2 fail."
  - "Replaces every host_name with the listing name → p1 fails."
  - "Fills with the literal string 'name' → c1 fails."
notes: ""
