# ---------- identity ----------
id: airbnb_col_005
version: 1
split: test                        # test | dev
dataset: airbnb
data_file: data/airbnb_dev.csv
transformation_type: column_transformation
difficulty: medium                    # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Shorten the room type labels: 'Entire home/apt' becomes 'entire', 'Private room' becomes 'private', and 'Shared room' becomes 'shared'.
assumptions:
  - "The mapping is applied to room_type in place; all three values are covered."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      out = df.copy()
      out["room_type"] = out["room_type"].map(
          {"Entire home/apt": "entire", "Private room": "private", "Shared room": "shared"}
      )
      return out

gold_contract:
  contract_version: "1.0"
  must_change:
    - id: c1
      type: column_value_relation
      target: room_type
      fn: map
      args: [{col: room_type}, {lit: {Entire home/apt: entire, Private room: private, Shared room: shared}}]
  must_preserve:
    - {id: p1, type: columns_unchanged, target: "*", except: [room_type]}
    - {id: p2, type: row_count, target: null, op: unchanged}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 1000
  columns_added: []
  columns_removed: []
  cells_changed: 1000

# ---------- notes ----------
notes: ""
