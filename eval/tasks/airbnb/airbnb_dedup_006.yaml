# ---------- identity ----------
id: airbnb_dedup_006
version: 1
split: dev                         # test | dev
dataset: airbnb
data_file: data/airbnb_dev.csv
transformation_type: deduplication
difficulty: hard                      # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Remove repeat listings from the same host that have the same room type and the same price. Keep the first one.
assumptions:
  - "Duplicate means same host_id, room_type and price; 'first' means earliest in the original row order."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      return df.drop_duplicates(subset=["host_id", "price", "room_type"], keep="first").copy()

gold_contract:
  contract_version: "1.0"
  must_change:
    - {id: c1, type: duplicate_count, target: [host_id, price, room_type], op: eq, value: 0, keep: first}
    - {id: c2, type: row_count, target: null, op: decreased}
  must_preserve:
    - {id: p1, type: columns_unchanged, target: "*", except: []}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 950
  columns_added: []
  columns_removed: []
  cells_changed: 0

# ---------- notes ----------
notes: ""
