# ---------- identity ----------
id: airbnb_col_002
version: 1
split: test                        # test | dev
dataset: airbnb
data_file: data/airbnb_dev.csv
transformation_type: column_transformation
difficulty: medium                    # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Clean up the listing names by removing any spaces or line breaks at the start and end.
assumptions:
  - "Only leading/trailing whitespace is removed; whitespace inside a name is kept."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      out = df.copy()
      out["name"] = out["name"].str.strip()
      return out

gold_contract:
  contract_version: "1.0"
  must_change:
    - id: c1
      type: column_value_relation
      target: name
      fn: strip
      args: [{col: name}]
  must_preserve:
    - {id: p1, type: columns_unchanged, target: "*", except: [name]}
    - {id: p2, type: row_count, target: null, op: unchanged}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 1000
  columns_added: []
  columns_removed: []
  cells_changed: 19

# ---------- notes ----------
notes: ""
