# ---------- the user request ----------
request: >
  Remove listings that require a minimum stay of more than 30 nights.
assumptions:
  - "'More than 30' is strict: listings with exactly 30 minimum nights are kept."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      return df[df["minimum_nights"] <= 30].copy()

gold_contract:
  contract_version: "1.0"
  must_change:
    - id: c1
      type: rows_removed_where
      target: null
      condition: {column: minimum_nights, op: ">", value: 30}
    - {id: c2, type: row_count, target: null, op: decreased}
  must_preserve:
    - id: p1
      type: rows_retained_where
      target: null
      condition: {column: minimum_nights, op: "<=", value: 30}
    - {id: p2, type: columns_unchanged, target: "*", except: []}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 967
  columns_added: []
  columns_removed: []
  cells_changed: 0

