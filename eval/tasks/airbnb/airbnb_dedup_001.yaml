# ---------- identity ----------
id: airbnb_dedup_001
version: 1
status: draft                      # draft | reviewed | frozen
split: test                        # test | dev
dataset: airbnb
data_file: data/airbnb_dev.csv
transformation_type: deduplication
difficulty: medium                    # suggested; easy | medium | hard
annotator: kiro-draft
reviewer: null

# ---------- the user request ----------
request: >
  Some listings share exactly the same name. Treat those as duplicates and keep only the first one.
assumptions:
  - "'First' means earliest in the original row order; names must match exactly (no trimming or case-folding)."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      return df.drop_duplicates(subset=["name"], keep="first").copy()

gold_contract:
  contract_version: "1.0"
  must_change:
    - {id: c1, type: duplicate_count, target: [name], op: eq, value: 0, keep: first}
    - {id: c2, type: row_count, target: null, op: decreased}
  must_preserve:
    - {id: p1, type: columns_unchanged, target: "*", except: []}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 980
  columns_added: []
  columns_removed: []
  cells_changed: 0

# ---------- notes ----------
pitfalls:
  - "drop_duplicates() without subset: no exact duplicate rows exist, so nothing is removed → c1, c2 fail."
  - "keep='last' → c1 fails (keep rule)."
  - "Strips or lower-cases names before comparing → c1 fails (different groups) and p1 may fail."
notes: ""
