# ---------- identity ----------
id: airbnb_col_003
version: 1
split: test                        # test | dev
dataset: airbnb
data_file: data/airbnb_dev.csv
transformation_type: column_transformation
difficulty: medium                    # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Cap minimum_nights at 30, so any value above 30 becomes 30.
assumptions:
  - "Values of 30 or less are unchanged; no rows are removed; the column stays integer."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      out = df.copy()
      out["minimum_nights"] = out["minimum_nights"].clip(upper=30)
      return out

gold_contract:
  contract_version: "1.0"
  must_change:
    - id: c1
      type: column_value_relation
      target: minimum_nights
      fn: clip
      args: [{col: minimum_nights}, {lit: null}, {lit: 30}]
  must_preserve:
    - {id: p1, type: columns_unchanged, target: "*", except: [minimum_nights]}
    - {id: p2, type: row_count, target: null, op: unchanged}
    - {id: p3, type: column_dtype, target: minimum_nights, dtype: int}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 1000
  columns_added: []
  columns_removed: []
  cells_changed: 33

# ---------- notes ----------
notes: ""
