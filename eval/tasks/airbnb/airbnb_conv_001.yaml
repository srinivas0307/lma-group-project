# ---------- identity ----------
id: airbnb_conv_001
version: 1
split: test                        # test | dev
dataset: airbnb
data_file: data/airbnb_dev.csv
transformation_type: type_conversion
difficulty: medium                    # suggested; easy | medium | hard

# ---------- the user request ----------
request: >
  Convert last_review into a proper date column. The dates are written in YYYY-MM-DD format (for example 2019-05-21).
assumptions:
  - "Dates are in ISO format YYYY-MM-DD; listings with no review date stay missing."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      out = df.copy()
      out["last_review"] = pd.to_datetime(out["last_review"], format="%Y-%m-%d")
      return out

gold_contract:
  contract_version: "1.0"
  must_change:
    - {id: c1, type: column_dtype, target: last_review, dtype: datetime}
  must_preserve:
    - id: p1
      type: column_value_relation
      target: last_review
      fn: cast
      args: [{col: last_review}, {lit: datetime}]
    - {id: p2, type: null_count, target: last_review, op: unchanged}
    - {id: p3, type: columns_unchanged, target: "*", except: [last_review]}
    - {id: p4, type: row_count, target: null, op: unchanged}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 1000
  columns_added: []
  columns_removed: []
  cells_changed: 959

# ---------- notes ----------
notes: ""
