# ---------- identity ----------
id: airbnb_miss_004
version: 1
status: draft                      # draft | reviewed | frozen
split: test                        # test | dev
dataset: airbnb
data_file: data/airbnb_dev.csv
transformation_type: missing_values
difficulty: medium                    # suggested; easy | medium | hard
annotator: kiro-draft
reviewer: null

# ---------- the user request ----------
request: >
  Replace missing reviews_per_month with the median of that column.
assumptions:
  - "The median is computed over the existing (non-missing) values before filling: 0.59 on this file."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      out = df.copy()
      out["reviews_per_month"] = out["reviews_per_month"].fillna(out["reviews_per_month"].median())
      return out

gold_contract:
  contract_version: "1.0"
  must_change:
    - id: c1
      type: column_value_relation
      target: reviews_per_month
      where: {column: reviews_per_month, op: is_null}
      fn: const
      args: [{lit: 0.59}]
    - {id: c2, type: null_count, target: reviews_per_month, op: eq, value: 0}
  must_preserve:
    - id: p1
      type: column_values_unchanged
      target: reviews_per_month
      where: {column: reviews_per_month, op: not_null}
    - {id: p2, type: columns_unchanged, target: "*", except: [reviews_per_month]}
    - {id: p3, type: row_count, target: null, op: unchanged}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 1000
  columns_added: []
  columns_removed: []
  cells_changed: 41

# ---------- notes ----------
pitfalls:
  - "Fills with the mean (≈0.93) → c1 fails."
  - "Fills with 0 → c1 fails."
  - "Fills every numeric column with its median → p2 fails."
notes: "Data-dependent literal: 0.59 is the median on data/airbnb_dev.csv only. Re-compute if the data file changes."
