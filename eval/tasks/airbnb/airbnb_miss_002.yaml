# ---------- identity ----------
id: airbnb_miss_002
version: 1
status: draft                      # draft | reviewed | frozen
split: test                        # test | dev
dataset: airbnb
data_file: data/airbnb_dev.csv
transformation_type: missing_values
difficulty: easy                      # suggested; easy | medium | hard
annotator: kiro-draft
reviewer: null

# ---------- the user request ----------
request: >
  Some listings have no host name. Put 'Unknown' in those places.
assumptions:
  - "Only missing host_name values are replaced; the text is exactly 'Unknown'."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      out = df.copy()
      out["host_name"] = out["host_name"].fillna("Unknown")
      return out

gold_contract:
  contract_version: "1.0"
  must_change:
    - id: c1
      type: column_value_relation
      target: host_name
      where: {column: host_name, op: is_null}
      fn: const
      args: [{lit: Unknown}]
    - {id: c2, type: null_count, target: host_name, op: eq, value: 0}
  must_preserve:
    - id: p1
      type: column_values_unchanged
      target: host_name
      where: {column: host_name, op: not_null}
    - {id: p2, type: columns_unchanged, target: "*", except: [host_name]}
    - {id: p3, type: row_count, target: null, op: unchanged}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 1000
  columns_added: []
  columns_removed: []
  cells_changed: 1

# ---------- notes ----------
pitfalls:
  - "df.fillna('Unknown') on the whole frame → fills last_review and reviews_per_month too → p2 fails."
  - "Drops the listing with no host name → p3 fails."
  - "Uses a different placeholder such as 'N/A' → c1 fails."
notes: ""
