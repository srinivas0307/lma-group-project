# ---------- identity ----------
id: airbnb_filt_003
version: 1
status: draft                      # draft | reviewed | frozen
split: test                        # test | dev
dataset: airbnb
data_file: data/airbnb_dev.csv
transformation_type: filtering
difficulty: medium                    # suggested; easy | medium | hard
annotator: kiro-draft
reviewer: null

# ---------- the user request ----------
request: >
  Drop any listing priced at 500 or more.
assumptions:
  - "Price threshold is inclusive: a listing at exactly 500 is dropped."

# ---------- ground truth ----------
reference_code: |
  def transform(df):
      return df[df["price"] < 500].copy()

gold_contract:
  contract_version: "1.0"
  must_change:
    - id: c1
      type: rows_removed_where
      target: null
      condition: {column: price, op: ">=", value: 500}
    - {id: c2, type: row_count, target: null, op: decreased}
  must_preserve:
    - id: p1
      type: rows_retained_where
      target: null
      condition: {column: price, op: "<", value: 500}
    - {id: p2, type: columns_unchanged, target: "*", except: []}

expected_effect:                   # fill in by running the reference (guide §12.1)
  rows_before: 1000
  rows_after: 980
  columns_added: []
  columns_removed: []
  cells_changed: 0

# ---------- notes ----------
pitfalls:
  - "Uses price > 500 (keeps listings at exactly 500) → c1 fails."
  - "Uses price <= 500 as the keep condition (same as above) → c1 fails."
  - "Removes outliers by a statistical rule instead of the fixed threshold → c1 or p1 fails."
notes: ""
