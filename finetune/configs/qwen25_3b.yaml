# QLoRA, Qwen2.5-3B-Instruct, Kaggle T4 (16 GB, fp16). System name after training: intent_ft_3b
base_model: Qwen/Qwen2.5-3B-Instruct
train_file: finetune/data/sft_train.jsonl
val_file: finetune/data/sft_val.jsonl
output_dir: finetune/runs/qwen25_3b
load_in_4bit: true
compute_dtype: float16            # T4 has no bfloat16
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
learning_rate: 2.0e-4
num_epochs: 2
per_device_batch_size: 2
gradient_accumulation_steps: 8    # effective batch 16
max_seq_len: 3072                 # p1-v2 prompt ~1.5k tokens + contract; margin so nothing is dropped
logging_steps: 10
eval_steps: 100
seed: 1234
